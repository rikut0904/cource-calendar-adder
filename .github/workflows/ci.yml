name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git diff --check
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - run: go test ./...
      - run: go vet ./...
